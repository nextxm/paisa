services:
  paisa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paisa
    restart: unless-stopped
    ports:
      - "7500:7500"
    volumes:
      - ./data:/root
    environment:
      - TZ=Asia/Kolkata
    # Old UI: http://localhost:7500/
    # New UI: http://localhost:7500/v2/
