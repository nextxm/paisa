server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://paisa:7500;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /connect/ {
        proxy_pass http://paisa:7500;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
