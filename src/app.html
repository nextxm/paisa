    <title>Paisa</title>
    <style>
      /* Pre-hydration splash to avoid a white flash before the SPA mounts. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f5f6f8;
        color: #2f323a;
        z-index: 9999;
        transition: opacity 180ms ease;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash-spinner {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 3px solid #d5d9e0;
        border-top-color: #2a6df4;
        animation: boot-spin 800ms linear infinite;
      }

      #boot-splash-text {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background:#f5f6f8;">
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-splash-spinner"></div>
      <div id="boot-splash-text">Loading Paisa...</div>
    </div>
    <div id="app-shell" style="display: contents">%sveltekit.body%</div>
    <script>
      (function () {
        const splash = document.getElementById("boot-splash");
        const appShell = document.getElementById("app-shell");
        if (!splash || !appShell) return;

        let hidden = false;
        const hideSplash = () => {
          if (hidden) return;
          hidden = true;
          splash.classList.add("is-hidden");
          setTimeout(() => splash.remove(), 220);
        };

        window.addEventListener(
          "load",
          () => {
            // Wait a frame after load so first app paint can happen under splash.
            requestAnimationFrame(() => setTimeout(hideSplash, 60));
          },
          { once: true }
        );

        // Safety valve if load never fires.
        setTimeout(hideSplash, 8000);
      })();
    </script>
  </body>
